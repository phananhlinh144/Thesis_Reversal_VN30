name: Auto Update Data CSV

on:
  schedule:
    # Chạy lúc 15:00 chiều VN (8:00 AM UTC) từ thứ 2 đến thứ 6
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Bấm chạy thủ công khi cần

jobs:
  run_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
          pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai

      - name: Run Update Script
        run: python update_data.py

      - name: Save and Push CSV
        run: |
          git config --global user.name "Data-Bot"
          git config --global user.email "bot@github.com"
          
          # Kiểm tra và push file raw
          if [ -f "vn30_data_raw.csv" ]; then
            git add vn30_data_raw.csv
            git commit -m "Auto-update VN30 data $(date)" || echo "No changes to commit"
            git push
          else
            echo "❌ Lỗi: Không tìm thấy file vn30_data_raw.csv!"
            exit 1
          fi
